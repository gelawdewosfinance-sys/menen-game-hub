<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Internet Connection</title>
    <style>
        body {
            background-color: #0a0a0d;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 350px;
            background: #16181e;
            border: 2px solid #ffd700;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
        }
        h1 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-refresh {
            background: linear-gradient(180deg, #ffea75, #ffd700);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            box-shadow: 0 4px 0 #b39200;
            width: 100%;
        }
        .btn-refresh:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b39200;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>No Internet Connection</h1>
        <p>Please check your network connection and try again to enjoy Menen Game Hub.</p>
        <button class="btn-refresh" onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
