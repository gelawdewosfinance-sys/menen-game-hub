<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menen Game Hub - Dark & Gold 3D</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div id="game-container">
        
        <!-- Header / Stats Bar -->
        <div id="top-bar" class="status-bar hidden">
            <div class="stat-box">🪙 Coins: <span id="coin-count">100</span></div>
            <div class="stat-box">❤️ Lives: <span id="life-count">3</span></div>
        </div>

        <!-- Main Home Screen -->
        <div id="home-screen" class="screen active">
            <div class="logo-container">
                <h1 class="logo-title">MENEN HUB</h1>
                <p class="logo-subtitle">3D Quiz & Puzzle Game</p>
            </div>

            <div class="menu-buttons">
                <button class="btn-3d" onclick="launchGame('quiz')">Play Quiz Game</button>
                <button class="btn-3d" onclick="launchGame('puzzle')">3D Puzzle Game</button>
                <button class="btn-3d btn-gold" onclick="claimDailyBonus()">Daily Bonus 🎁</button>
            </div>
        </div>

        <!-- Quiz Gameplay Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-card-3d">
                <p id="quiz-question-text">Loading question...</p>
            </div>
            <div id="quiz-answers-group" class="answers-container">
                <!-- Buttons injected via JavaScript -->
            </div>
            <button class="btn-3d btn-dark" onclick="goBackHome()">Back to Home</button>
        </div>

        <!-- Puzzle Gameplay Screen -->
        <div id="puzzle-screen" class="screen">
            <h2 class="section-title">3D Memory Match</h2>
            <div id="puzzle-board" class="puzzle-grid">
                <!-- Cards injected via JavaScript -->
            </div>
            <button class="btn-3d btn-dark" onclick="goBackHome()">Back to Home</button>
        </div>

        <!-- AdMob Rewarded Ad Simulation Overlay -->
        <div id="ad-simulation-modal" class="overlay hidden">
            <div class="modal-card">
                <h3 style="color: #ffd700;">AdMob Sponsored Ad</h3>
                <p style="margin: 10px 0; color: #bbb;">Watching ad... (<span id="ad-step">1</span>/<span id="ad-max">3</span>)</p>
                <div id="ad-timer-display" class="timer-circle">5</div>
                <p style="font-size: 11px; color: #777;">Please wait until the ad finishes</p>
            </div>
        </div>

        <!-- Continue / Game Over Modal -->
        <div id="gameover-modal" class="overlay hidden">
            <div class="modal-card">
                <h2 style="color: #ff4d4d;">Game Over!</h2>
                <p style="margin: 15px 0; font-size: 14px; color: #ddd;">
                    Would you like to watch 1 to 3 ads to restore your lives and continue playing?
                </p>
                <button class="btn-3d" onclick="playRewardedAdsFlow()">Watch Ads & Continue 🎬</button>
                <button class="btn-3d btn-dark" onclick="closeGameOverAndExit()">No Thanks (Exit)</button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
